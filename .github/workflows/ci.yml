name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1" # e2e specs are not part of this job
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable # installs the pnpm version pinned in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check no hosted-only path is tracked (the hosted service is closed source, not in this MIT repo)
        run: node scripts/check-hosted-paths.mjs
      - name: Build (generates Next's route types and the app the CLI tests start)
        run: npx next build --webpack
      - name: "Build the browser entry (sealed tree: fails on an import that leaves browser/)"
        run: pnpm run build:browser
      - name: Check the package contents (denylisted paths, secrets, size ceiling)
        run: node scripts/check-tarball.mjs
      - name: Type check
        run: pnpm exec tsc --noEmit
      - name: Lint
        run: pnpm lint
      - name: Tests
        run: pnpm run test:cli
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build (the CLI test refuses a stale or missing .next)
        run: npx next build --webpack
      - name: "Build the browser entry (sealed tree: fails on an import that leaves browser/)"
        run: pnpm run build:browser
      - name: Tests (node + Playwright, fake keys, no network)
        run: pnpm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results
