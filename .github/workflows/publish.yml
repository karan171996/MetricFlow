name: Publish

# Manual only. Publishes the version in package.json on main to npm, with provenance.
# No npm token is stored anywhere: npm trusts this workflow through OIDC ("trusted publishing").
# One-time set-up on npmjs.com and GitHub is described in CONTRIBUTING.md, "Publishing".
#
# Release channels (see CONTRIBUTING.md, "Release channels"):
#   stable  the version in package.json, published under the npm dist-tag `latest`. Also leaves a
#           `v<version>` git tag and a GitHub release.
#   canary  `<package.json version>-canary.g<short sha>`, published under the dist-tag `canary`. It never
#           touches `latest`, so a normal install is unchanged. For testing what is on main.
#
# Three jobs on purpose. Everything that runs code from the repository or from npm (install, build,
# tests) happens in a job that cannot publish. The job that can publish runs none of it: it only
# takes the finished tarball and hands it to npm. The job that writes the tag and the release runs
# only the GitHub CLI, after the publish succeeded.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "stable publishes package.json's version as latest. canary publishes <version>-canary.g<sha> as canary."
        type: choice
        options:
          - stable
          - canary
        default: stable

permissions:
  contents: read

# One release at a time; a second run waits instead of racing the first.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    name: build and test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read # no id-token here: nothing in this job can publish
    outputs:
      version: ${{ steps.channel.outputs.version }}
      tag: ${{ steps.channel.outputs.tag }}
    env:
      CYPRESS_INSTALL_BINARY: "0"
    steps:
      # Actions are pinned to commits: a moved tag must not be able to change what runs in a release.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Decide the version and the npm dist-tag for this channel
        id: channel
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          base="$(node -p "require('./package.json').version")"
          if [ "$CHANNEL" = "canary" ]; then
            # The "g" keeps the identifier non-numeric: a short sha that is all digits and starts
            # with 0 would be an invalid semver identifier.
            version="${base}-canary.g${GITHUB_SHA::7}"
            tag="canary"
          else
            case "$base" in
              *-*) echo "A stable release needs a plain x.y.z version; package.json has $base." >&2; exit 1 ;;
            esac
            if git ls-remote --exit-code --tags origin "refs/tags/v${base}" >/dev/null 2>&1; then
              echo "The tag v${base} already exists. Bump the version before a stable release." >&2
              exit 1
            fi
            version="$base"
            tag="latest"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Channel $CHANNEL: $version, dist-tag $tag"
      - run: corepack enable
      # No dependency cache in a release: a cache written by another run must not reach the tarball.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Build the dashboard and the browser entry
        run: pnpm run build
      - name: Type check
        run: pnpm exec tsc --noEmit
      - name: Lint
        run: pnpm lint
      - name: Tests (includes the build check on the packed tarball)
        run: pnpm run test:cli
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
      - name: Pack what was just built and tested
        env:
          VERSION: ${{ steps.channel.outputs.version }}
        run: |
          set -euo pipefail
          # Only the version string changes, and only in this job's checkout (nothing is committed).
          npm pkg set version="$VERSION"
          mkdir release
          npm pack --ignore-scripts --pack-destination release
          packed="$(tar -xOzf release/*.tgz package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')"
          if [ "$packed" != "$VERSION" ]; then
            echo "The tarball says $packed, expected $VERSION." >&2
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package
          path: release/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm # give this environment required reviewers, so a publish needs a second click
    permissions:
      contents: read
      id-token: write # the OIDC token npm exchanges for a short-lived publish credential
    steps:
      # No checkout and no install: this job runs no code from the repository or its dependencies.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24 # trusted publishing needs npm 11.5.1 or newer
          registry-url: https://registry.npmjs.org
      - name: npm is new enough for trusted publishing
        run: node -e "const [a,b,c]=process.argv[1].split('.').map(Number); if (a<11||(a===11&&(b<5||(b===5&&c<1)))) { console.error('npm '+process.argv[1]+' is older than 11.5.1'); process.exit(1) }" "$(npm --version)"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package
          path: release
      - name: Publish the tarball the first job built, under the channel's dist-tag
        env:
          NPM_TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          # The dist-tag is always explicit, and `latest` can only carry a plain x.y.z version.
          case "$NPM_TAG:$VERSION" in
            latest:*-*) echo "Refusing to publish the prerelease $VERSION as latest." >&2; exit 1 ;;
            latest:*) ;;
            canary:*-canary.*) ;;
            *) echo "Unexpected dist-tag and version: $NPM_TAG $VERSION" >&2; exit 1 ;;
          esac
          packed="$(tar -xOzf release/*.tgz package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')"
          if [ "$packed" != "$VERSION" ]; then
            echo "The tarball says $packed, expected $VERSION." >&2
            exit 1
          fi
          npm publish release/*.tgz --tag "$NPM_TAG" --provenance --access public --ignore-scripts

  # Stable only. Runs no repository code and installs nothing: it only calls the GitHub CLI, after the
  # npm publish succeeded. contents: write lives in this job alone.
  release:
    name: tag and GitHub release
    needs: [build, publish]
    if: github.ref == 'refs/heads/main' && needs.build.outputs.tag == 'latest'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the v<version> tag and release on the commit that was published
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: gh release create "v${VERSION}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "v${VERSION}" --generate-notes
